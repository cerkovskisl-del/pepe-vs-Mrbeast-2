<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pepe Kosmosā</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="lang-container">
        <button class="lang-btn active" onclick="changeLanguage('lv')" tabindex="-1">LV</button>
        <button class="lang-btn" onclick="changeLanguage('en')" tabindex="-1">EN</button>
        <button class="lang-btn" onclick="changeLanguage('ru')" tabindex="-1">RU</button>
    </div>

    <div class="game-wrapper">
        
        <div class="side-panel skin-sidebar">
            <h3 class="sidebar-title">SKINI</h3>
            
            <button class="skin-btn active" id="skin-default" onclick="selectSkin('default')" tabindex="-1">
                <div class="skin-name" id="skin-default-name">Parastais</div>
                <div class="skin-status" id="status-default">Izvēlēts</div>
            </button>

            <button class="skin-btn locked" id="skin-fat" onclick="buySkin('fat', 500)" tabindex="-1">
                <div class="skin-name">Fat Pepe</div>
                <div class="skin-status" id="status-fat">500p</div>
            </button>

            <button class="skin-btn locked" id="skin-ninja" onclick="buySkin('ninja', 1500)" tabindex="-1">
                <div class="skin-name">Ninja Pepe</div>
                <div class="skin-status" id="status-ninja">1500p</div>
            </button>
        </div>

        <div class="canvas-area">
            <div class="mode-selection" style="margin-bottom: 12px; display: flex; gap: 10px; justify-content: center;">
                <button id="btn-mode-normal" class="lang-btn active" onclick="switchMode('normal')" tabindex="-1" style="padding: 8px 16px; cursor: pointer;">Līmeņi</button>
                <button id="btn-mode-parkour" class="lang-btn" onclick="switchMode('parkour')" tabindex="-1" style="padding: 8px 16px; cursor: pointer;">Parkour (+10p)</button>
            </div>

            <div class="hud">
                <span id="score-text">Punkti</span>: <span id="score-val">0</span>
            </div>
            <canvas id="gameCanvas" width="1000" height="500"></canvas>
        </div>

        <div class="side-panel shop-sidebar">
            <h3 id="shop-title">VEIKALS</h3>
            
            <button class="shop-item-btn" onclick="buyUpgrade(1)" tabindex="-1">
                <div class="shop-item-name" id="shop-speed-text">+Ātrums</div>
                <div class="shop-item-lvl" id="speed-lvl-display">Lvl 0</div>
                <div class="shop-item-price">50p</div>
            </button>

            <button class="shop-item-btn" onclick="buyUpgrade(2)" tabindex="-1">
                <div class="shop-item-name" id="shop-jump-text">+Lēciens</div>
                <div class="shop-item-lvl" id="jump-lvl-display">Lvl 0</div>
                <div class="shop-item-price">50p</div>
            </button>

            <button class="shop-item-btn" onclick="buyUpgrade(3)" tabindex="-1">
                <div class="shop-item-name" id="shop-skip-text">Izlaist Līmeni</div>
                <div class="shop-item-price">100p</div>
            </button>

            <button class="reset-progress-btn" id="btn-reset-game" onclick="clearSavedProgress()" tabindex="-1">Reset Game</button>
        </div>
    </div>

    <div class="mobile-controls">
        <div class="move-buttons">
            <button id="btn-left" tabindex="-1">◀</button>
            <button id="btn-right" tabindex="-1">▶</button>
        </div>
        <button id="btn-jump" tabindex="-1">LĒKT</button>
    </div>

    <div class="controls-info" id="controls-text">
        Vadība: Bultiņas/WASD = Kustība | Atstarpe = Lēkt
    </div>

    <script src="script.js"></script>

    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
